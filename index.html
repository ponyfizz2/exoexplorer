<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>EXOEXPLORER — Every Confirmed Exoplanet, Explorable</title>
    <meta name="description" content="Explore all 6,000+ confirmed exoplanets in real 3D space. Live data from the NASA Exoplanet Archive, true habitable-zone physics, procedural world rendering and a travel-time calculator." />
    <meta name="theme-color" content="#04060f" />
    <meta name="color-scheme" content="dark" />
    <link rel="canonical" href="https://exoexplorer-bay.vercel.app/" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="EXOEXPLORER — Every Confirmed Exoplanet, Explorable" />
    <meta property="og:description" content="A real-time, 3D map of every confirmed world beyond the Solar System, built on live NASA Exoplanet Archive data." />
    <meta property="og:url" content="https://exoexplorer-bay.vercel.app/" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
    />
    <link rel="stylesheet" href="/src/styles.css" />
    <link rel="preconnect" href="https://exoplanetarchive.ipac.caltech.edu" />
  </head>
  <body>
    <canvas id="starfield" aria-hidden="true"></canvas>

    <!-- Boot ---------------------------------------------------------------->
    <div class="boot" id="boot">
      <div class="boot-inner">
        <div class="orbit-loader" aria-hidden="true"><div></div><div></div><div></div><div></div></div>
        <h2>Exoexplorer</h2>
        <p id="boot-status">Contacting the NASA Exoplanet Archive…</p>
        <div class="boot-progress" aria-hidden="true"><i></i></div>
      </div>
    </div>

    <div class="shell" id="shell" hidden>
      <header class="app-header">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="#04060f" stroke-width="1.9" stroke-linecap="round">
              <circle cx="12" cy="12" r="3.4" />
              <ellipse cx="12" cy="12" rx="10" ry="4.6" transform="rotate(-22 12 12)" />
              <circle cx="20.4" cy="8.6" r="1.5" fill="#04060f" />
            </svg>
          </div>
          <div class="brand-text">
            <h1>EXO<em>EXPLORER</em></h1>
            <p>Interstellar Survey Console</p>
          </div>
        </div>

        <div class="header-stats" id="header-stats"></div>

        <div class="status-chip" id="feed-status" title="Data source status">
          <span class="status-dot"></span><span id="feed-status-text">LIVE FEED</span>
        </div>
      </header>

      <nav class="tabbar" role="tablist" aria-label="Sections" id="tabbar"></nav>

      <main class="views" id="views">
        <!-- Galaxy -->
        <section class="view active" id="view-galaxy" role="tabpanel" aria-labelledby="tab-galaxy">
          <div class="galaxy-layout">
            <aside class="galaxy-sidebar" id="galaxy-sidebar"></aside>
            <div class="galaxy-stage" id="galaxy-stage">
              <div class="galaxy-canvas" id="galaxy-canvas"></div>
              <div class="galaxy-hud" id="galaxy-hud"></div>
              <div class="floating-tooltip" id="galaxy-tooltip"></div>
            </div>
          </div>
        </section>

        <!-- Atlas -->
        <section class="view view--scroll" id="view-atlas" role="tabpanel" aria-labelledby="tab-atlas">
          <div class="view-inner"><div id="atlas-body"></div></div>
        </section>

        <!-- Analytics -->
        <section class="view view--scroll" id="view-lab" role="tabpanel" aria-labelledby="tab-lab">
          <div class="view-inner"><div id="lab-body"></div></div>
        </section>

        <!-- Habitable worlds -->
        <section class="view view--scroll" id="view-worlds" role="tabpanel" aria-labelledby="tab-worlds">
          <div class="view-inner"><div id="worlds-body"></div></div>
        </section>

        <!-- Data -->
        <section class="view view--scroll" id="view-data" role="tabpanel" aria-labelledby="tab-data">
          <div class="view-inner"><div id="data-body"></div></div>
        </section>
      </main>
    </div>

    <!-- Detail overlay -------------------------------------------------------->
    <div class="overlay" id="detail" role="dialog" aria-modal="true" aria-label="Planet detail" aria-hidden="true">
      <div class="detail-layout">
        <div class="detail-viewport">
          <div class="detail-canvas" id="detail-canvas"></div>
          <div class="detail-toolbar">
            <button class="btn btn--ghost" id="detail-close" type="button">
              <span style="width:15px;height:15px;display:inline-flex" id="detail-close-icon"></span> Back to console
            </button>
            <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end">
              <div class="tabstrip" id="detail-view-tabs" role="group" aria-label="3D view"></div>
              <button class="btn btn--sm" id="detail-pause" type="button" aria-pressed="false">Pause orbits</button>
            </div>
          </div>
          <div class="detail-titleblock">
            <h2 id="detail-name">—</h2>
            <div class="sub" id="detail-sub">—</div>
            <p class="blurb" id="detail-blurb"></p>
          </div>
        </div>
        <aside class="detail-side" id="detail-side"></aside>
      </div>
    </div>

    <div class="toasts" id="toasts" aria-live="polite"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
